name: fq_report_project

services:
  db:
    image: postgres:16-alpine
    container_name: fq_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - fq_postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fq_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      AUTH_SECRET: "${AUTH_SECRET}"
      NODE_ENV: "production"
      # Cookie sesi login butuh HTTPS (flag Secure) secara default di
      # production. Nilai diatur lewat .env (COOKIE_SECURE=false kalau app
      # diakses HTTP polos tanpa reverse proxy/Cloudflare yang terminasi TLS).
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      # Token bot Telegram (dari @BotFather) — diisi lewat .env, opsional.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
    ports:
      - "3050:3000"
    volumes:
      - ./public:/app/public
      - ./backup_db:/app/backup_db
      - ./data:/app/data

volumes:
  fq_postgres_data:

